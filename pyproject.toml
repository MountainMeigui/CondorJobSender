[project]
name = "condor-job-sender"
version = "0.1.0"
description = "Utilities for submitting Python jobs and DAG workflows to HTCondor."
authors = [
    { name = "Vered Cohen"}
]
requires-python = ">=3.10"
dependencies = [
    "htcondor>=25.13.2 ; sys_platform == 'linux'",
	"networkx>=3.2",
	"pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
